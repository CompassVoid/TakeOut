    <style type="text/css">
        .layui-form-label{
            width: 100px;
        }
        .form-box{
            padding-top: 90px;
            padding-bottom: 20px;
            width: 100%;
            background-color: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-box .form-content{
            width: 50%;
            height: auto;
            background: #FFF;
            padding: 40px 10%;
            position: relative;
        }
        .form-box .form-content .close-btn{
            position: absolute;
            width: auto!important;
            padding: 10px;
            background: #CCCCCC!important;
            color: #444;
            top: 40px;
            right: 10%;
        }
        .form-box .form-content .close-btn:hover{
            width: auto!important;
            padding: 10px;
            background: #CCCCCC!important;
        }
        .form-box .form-content h3{
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
        }
        .form-box .form-content .input-item{
            margin-bottom: 20px;
            display: flex;
        }
        .form-box .form-content .input-item input{
            height: 50px;
            line-height: 50px;
            flex: 1;
        }
        .form-box .form-content .input-item .input-name{
            padding: 0;
            width: 100px;
            height: 50px;
            line-height: 50px;
        }
        .form-box .form-content .input-item img{
            width: 150px;
            height: 150px;
            border-radius: 10px;
            margin-left: 20px;
            object-fit: cover;
        }
        .form-box .form-content button{
            background: #FE4847;
            color: #fff;
            border: 0;
            width: 100%;
        }
        .form-box .form-content button:hover {
            background: #292929;
            color: #fff;
        }
        .layui-upload-img{
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="form-box layui-form" lay-filter="layform">
        <div class="form-control form-content">
            <h3>订单填写</h3>
            <div>
                <div class="layui-form-item">
                    <label class="layui-form-label">名称</label>
                    <div class="layui-input-block">
                        <input v-model="detail.mingcheng" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="菜品名称" class="layui-input" readonly="readonly">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">类型</label>
                    <div class="layui-input-block">
                        <input v-model="detail.leixing" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="请输入类型" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">图片</label>
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn" id="tupianupload-img" v-if="!detail.tupian">上传图片</button>
                        <div class="layui-upload-list" v-if="detail.tupian">
                            <img class="layui-upload-img" id="tupianimg-temp" :src="detail.tupian?detail.tupian.split(',')[0]:''">
                            <p id="demoText"></p>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">价格</label>
                    <div class="layui-input-block">
                        <input v-model="detail.jiage" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="菜品价格" class="layui-input" readonly="readonly">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">购买数量</label>
                    <div class="layui-input-block">
                        <input v-model="detail.goumaishuliang" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="请输入购买数量" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">总价格</label>
                    <div class="layui-input-block">
                        <input v-model="zongjiage" type="text" name="" placeholder="请输入总价格" autocomplete="off" class="layui-input" readonly="readonly">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">商家编号</label>
                    <div class="layui-input-block">
                        <input v-model="detail.shangjiabianhao" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="请输入商家编号" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">商家名称</label>
                    <div class="layui-input-block">
                        <input v-model="detail.shangjiamingcheng" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="请输入商家名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">账号</label>
                    <div class="layui-input-block">
                        <input v-model="detail.zhanghao" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="请输入账号" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">手机</label>
                    <div class="layui-input-block">
                        <input v-model="detail.shouji" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="请输入手机" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">骑手收益</label>
                    <div class="layui-input-block">
                        <input :value="qishouIncome" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="请输入骑手收益" class="layui-input" readonly="readonly">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">下单时间</label>
                    <div class="layui-input-block">
                        <input type="text" name="" placeholder="请输入下单时间" autocomplete="off" class="layui-input" id="xiadanshijian">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <input v-model="detail.beizhu" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="请输入备注" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">地址</label>
                    <div class="layui-input-block">
                        <input id="fulladdressMap" v-model="detail.fulladdress" type="text" name="title" lay-verify="title" autocomplete="off" placeholder="点击选择地址" class="layui-input">
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-default" @click="onConfirmTap">提交</button>
        </div>
    </div>
</div>

<script src="../../assets/js/vue.min.js"></script>

<script type="text/javascript" src="http://webapi.amap.com/maps?v=1.3&key=ca04cee7ac952691aa67a131e6f0cee0"></script>

<script type="text/javascript">
    var app = new Vue({
        el: "#app",
        data: {
            crosstable: "",
            crosstableobj: {},
                detail: {
                    caipinid: "",
                    mingcheng: "",
                    leixing: "",
                    tupian: "",
                    jiage: "",
                    goumaishuliang: "1",
                    zongjiage: "",
                    shangjiabianhao: "",
                    shangjiamingcheng: "",
                    zhanghao: "",
                shouji: "",
                qishoushouyi: "",
                xiadanshijian: "",
                beizhu: "",
                sfsh: "",
                shhf: "",
                ispay: "",
                longitude: "",
                latitude: "",
                fulladdress: "",
            },
        },
        computed: {
            zongjiage:{
              get: function () {
                const price = Number(this.detail.jiage)||0
                const qty = Number(this.detail.goumaishuliang)||0
                return price*qty
              }
            },
            qishouIncome(){
              const total = this.zongjiage || 0
              return Math.round(total * 0.2)
            }
        },
        updated() {
        },
        async created() {
            var id = getParam('id')
            var tablename = getParam('tablename')
            this.crosstable = tablename
            if(tablename){
                var cross = JSON.parse(localStorage.getItem("crossObj"))
                this.crosstableobj = cross
                this.fillFromCross(cross)
            }else if(id){
                await this.getDetail(id, tablename)
            }
            // If entered from cart confirmation, try to read the first item.
            if(!this.detail.caipinid){
                var goodsCache = JSON.parse(localStorage.getItem("orderGoods")||"[]")
                if(goodsCache.length>0){
                    this.fillFromCross(goodsCache[0])
                }
            }

            var user = localStorage.getItem("sessionTable")
            session(`${user}`, (data)=>{
                if (data && data.code === 0) {
                    var json = data.data;
                    this.detail.zhanghao = json.zhanghao
                    this.detail.shouji = json.shouji
                }
            })

            if(id){
                this.getDetail(tablename || "caipin", id).then((res)=>{
                    if(res && res.data){
                        this.detail.caipinid = res.data.id
                        this.detail.jiage = res.data.jiage || this.detail.jiage
                        this.detail.mingcheng = res.data.mingcheng || this.detail.mingcheng
                        this.detail.leixing = res.data.leixing || this.detail.leixing
                        this.detail.shangjiabianhao = res.data.shangjiabianhao || this.detail.shangjiabianhao
                        this.detail.shangjiamingcheng = res.data.shangjiamingcheng || this.detail.shangjiamingcheng
                    }
                })
            }
        },
        methods: {
            onPageTap(url) {
                window.location.href = url
            },
            updateTap(tablename, data){
                return new Promise((resolve) => {
                    updateFun(tablename, data, (res) => {
                        if(res&&res.code==0){
                            console.log("update ok")
                            resolve(res)
                        }
                    })
                })

            },
            onConfirmTap(){
                $("#fulladdressMap").click();
                $("#idAMapPositionPickerCancelBtn").click();
                this.detail.fulladdress = $('#fulladdressMap').val();
                if(!this.detail.goumaishuliang || this.detail.goumaishuliang<1){
                    this.detail.goumaishuliang = 1
                }
                this.detail.jiage = (this.crosstableobj && this.crosstableobj.jiage) || this.detail.jiage
                this.detail.mingcheng = (this.crosstableobj && this.crosstableobj.mingcheng) || this.detail.mingcheng
                this.detail.shangjiabianhao = (this.crosstableobj && this.crosstableobj.shangjiabianhao) || this.detail.shangjiabianhao
                this.detail.shangjiamingcheng = (this.crosstableobj && this.crosstableobj.shangjiamingcheng) || this.detail.shangjiamingcheng

                this.detail.zongjiage = this.zongjiage
                this.detail.qishoushouyi = this.qishouIncome
                if(!this.detail.caipinid && this.crosstableobj && this.crosstableobj.id){
                    this.detail.caipinid = this.crosstableobj.id
                }
                if(!this.detail.caipinid && this.detail.id){
                    this.detail.caipinid = this.detail.id
                }
                if(!this.detail.xiadanshijian){
                    var now = new Date();
                    var pad = function(num){ return num < 10 ? '0' + num : num; };
                    this.detail.xiadanshijian = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
                        + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
                }
                if(this.detail.longitude === ""){
                    this.detail.longitude = null;
                }
                if(this.detail.latitude === ""){
                    this.detail.latitude = null;
                }
                if(!isIntNumer(this.detail.goumaishuliang)){
                    alert(`购买数量应输入整数`);
                    return
                }
                $.ajax({
                    url: baseurl + "dingdan/add",
                    beforeSend: function(request) {
                        request.setRequestHeader("Token", localStorage.getItem("Token"));
                    },
                    contentType: 'application/json',
                    data: JSON.stringify(this.detail),
                    dataType: 'json',
                    type: 'POST',
                    success: function(result) {
                        if(result && result.code == 0) {
                            alert("提交成功");
                            window.history.go(-1);
                        } else if(result && result.code == 401) {
                            window.location.href = '../login/login.html';
                        } else {
                            alert("提交失败");
                        }
                    },
                    error: function() {
                        alert("提交失败");
                    }
                });
            },


            getDetail(tablename, id) {
                return new Promise((resolve) => {
                goodsInfo(tablename, id, (res) => {
                    this.detail = res.data
                    this.detail.caipinid = res.data.id || this.detail.caipinid
                    resolve(res)
                })
                })
            },
            fillFromCross(cross){
                if(!cross) return
                for(var key in cross){
                    if("id" == key){
                        this.detail.caipinid = cross[key]
                    }
                    if(["mingcheng","leixing","tupian","jiage","goumaishuliang","zongjiage","shangjiabianhao","shangjiamingcheng","zhanghao","shouji","beizhu","longitude","latitude","fulladdress"].indexOf(key)>-1){
                        this.detail[key] = cross[key]
                    }
                }
            }
        }

    })
     $(document).ready(function() {
        var p = $("#fulladdressMap").AMapPositionPicker();
        $("#fulladdressMap").on('click', function() {
            var position = p.AMapPositionPicker('position');
            console.log(position)
            app.detail.latitude = position.latitude;
            app.detail.longitude = position.longitude;
            app.detail.fulladdress = position.address;
        });
    });
    $(function(){






        layui.use('upload', function(){
            var $ = layui.jquery
            ,upload = layui.upload;
            //普通图片上传
            var uploadInst = upload.render({
                elem: '#tupianupload-img'
                ,url: baseurl+"file/upload" //改成您自己的上传接口
                ,headers: {
                    Token: getStorage("Token")
                }
                ,before: function(obj){
                  //预读本地文件示例，不支持ie8
                  obj.preview(function(index, file, result){
                    $('#tupianimg-temp').attr('src', result); //图片链接（base64）
                  });
                }
                ,done: function(res){
                  //如果上传失败
                  if(res.code > 0){
                    return layer.msg('上传失败');
                  }else{
                      app.detail.tupian = baseurl+"/upload/"+res.file
                      return layer.msg('上传成功');
                  }
                  //上传成功
                }
            })
        });
















        layui.use('laydate', function(){
            var laydate = layui.laydate;
            //日期时间选择器
            laydate.render({
                elem: '#xiadanshijian',
                type: 'datetime',
                done: function(value, date, endDate){
                    console.log(value); //得到日期生成的值，如：2017-08-18
                    app.detail.xiadanshijian = value
                 }
            });
        });
















        layui.use(['form','layedit'], function(){
            var form = layui.form,
                layedit = layui.layedit,
                $ = layui.jquery,
                layer = layui.layer;

        });
    });
</script>
</body>
</html>
